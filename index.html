<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlists Génération 1977 · Portrait d'Époque</title>
<meta name="description" content="Dix chansons populaires en France pour chaque année, de 1977 à 1995. Les playlists du livre Portrait d'Époque, Génération 1977.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0EC;      /* papier gris-vert, pochette usée */
  --ink:#18202C;        /* encre bleu nuit */
  --muted:#5A6372;
  --vinyl:#1A1C20;      /* noir du disque */
  --groove:#2A2D33;
  --label:#2B4BD6;      /* étiquette bleu cobalt */
  --label-ink:#F4F5F7;
  --mine:#F2C230;       /* étiquette jaune : l'année arrivée par QR code */
  --line:#C9CEC6;
  --focus:#2B4BD6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181F; --ink:#EEF0EC; --muted:#A3AAB6; --vinyl:#050608; --groove:#1E2128;
    --label:#4F6CF0; --line:#2C323C; --focus:#F2C230;
  }
}
:root[data-theme="dark"]{
  --paper:#14181F; --ink:#EEF0EC; --muted:#A3AAB6; --vinyl:#050608; --groove:#1E2128;
  --label:#4F6CF0; --line:#2C323C; --focus:#F2C230;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Figtree",system-ui,sans-serif; font-size:17px; line-height:1.5;
}
.wrap{max-width:860px; margin:0 auto; padding:40px 16px 64px}

/* En-tête */
.brand{font-family:"Bodoni Moda",Georgia,serif; font-weight:500; font-size:1.05rem; margin:0 0 28px; letter-spacing:.01em}
h1{
  font-family:"Bodoni Moda",Georgia,serif; font-weight:700;
  font-size:clamp(2.6rem,9vw,4.6rem); line-height:1; margin:0 0 14px; letter-spacing:-.01em;
}
.lede{margin:0 0 32px; color:var(--muted); max-width:34em; font-size:1.06rem}

/* Sélecteur de plateforme */
.picker{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:0 0 10px}
.picker-label{font-weight:600}
.toggle{display:inline-flex; border:2px solid var(--ink); border-radius:999px; padding:3px}
.toggle button{
  font:inherit; font-weight:600; font-size:1rem; color:var(--ink);
  background:transparent; border:0; border-radius:999px; padding:10px 18px; cursor:pointer; min-height:44px;
}
.toggle button[hidden]{display:none}
.toggle button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.hint{margin:0 0 36px; color:var(--muted); font-size:.98rem}

/* Bandeau d'arrivée par QR code */
.arrival{
  display:none; margin:0 0 28px; padding:14px 18px; border-left:6px solid var(--mine);
  background:color-mix(in srgb, var(--mine) 14%, transparent);
}
.arrival.on{display:block}

/* Les disques */
.records{
  list-style:none; margin:0; padding:0;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:30px 22px;
}
.records[data-platform="spotify"]{--label:#1DB954}
.records[data-platform="deezer"]{--label:#A238FF}
.records[data-platform="youtube"]{--label:#FF0033}
.record{
  display:flex; flex-direction:column; align-items:center; text-decoration:none; color:inherit;
  border-radius:16px; padding:6px 4px 10px; outline-offset:4px;
}
.disc{
  position:relative; width:118px; aspect-ratio:1; border-radius:50%;
  background:
    radial-gradient(circle, transparent 0 31%, var(--vinyl) 31.5%),
    repeating-radial-gradient(circle, var(--vinyl) 0 2px, var(--groove) 2.5px 3.5px);
  box-shadow:inset 0 0 0 3px var(--groove);
  transition:transform .5s cubic-bezier(.2,.7,.2,1);
}
.disc::before{ /* étiquette centrale */
  content:""; position:absolute; inset:24%; border-radius:50%; background:var(--label);
}
.disc::after{ /* trou central */
  content:""; position:absolute; left:50%; top:50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
  border-radius:50%; background:var(--paper);
}
.year{
  font-family:"Bodoni Moda",Georgia,serif; font-weight:700; font-size:1.7rem; line-height:1;
  margin-top:12px; font-variant-numeric:lining-nums;
}
.age{color:var(--muted); font-size:.95rem; margin-top:4px}
.record:hover .disc, .record:focus-visible .disc{transform:rotate(200deg)}
.record:focus-visible{outline:3px solid var(--focus)}
.record.mine .disc::before{background:var(--mine)}
.record.mine .year{text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:6px; text-decoration-color:var(--mine)}
.record[aria-disabled="true"]{cursor:default}
.record[aria-disabled="true"] .disc{opacity:.35}

.foot{margin-top:56px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:.92rem}
.foot p{margin:0 0 6px}

@media (prefers-reduced-motion: reduce){ .disc{transition:none} .record:hover .disc,.record:focus-visible .disc{transform:none} }
@media (max-width:420px){
  .records{grid-template-columns:repeat(3,1fr); gap:24px 10px}
  .disc{width:92px}
  .year{font-size:1.4rem}
}
</style>
</head>
<body>
<main class="wrap">
  <p class="brand">Portrait d'Époque</p>
  <h1 id="gen-title">Génération 1977</h1>
  <p class="lede">Dix chansons populaires en France pour chaque année, de 1977 à 1995.</p>

  <div class="picker">
    <span class="picker-label" id="picker-label">Écouter sur</span>
    <div class="toggle" role="group" aria-labelledby="picker-label">
      <button type="button" data-platform="youtube" aria-pressed="true">YouTube</button>
      <button type="button" data-platform="spotify" aria-pressed="false">Spotify</button>
      <button type="button" data-platform="deezer" aria-pressed="false">Deezer</button>
    </div>
  </div>
  <p class="hint">Appuie sur un disque pour lancer sa playlist.</p>

  <p class="arrival" id="arrival" role="status"></p>

  <ol class="records" id="records" aria-label="Playlists par année"></ol>

  <footer class="foot">
    <p>Ces playlists accompagnent le livre Portrait d'Époque, Génération 1977 : Revivez vos 18 premières années.</p>
  </footer>
</main>

<script>
/* ============================================================
   LIENS À COMPLÉTER
   Colle le lien de chaque playlist entre les guillemets.
   Une année sans lien s'affiche en grisé avec « bientôt ».
   Pour un futur livre, ajoute un bloc "1980": { ... } plus bas.
   ============================================================ */
const GENERATIONS = {
  "1977": {
    1977: { spotify: "https://open.spotify.com/playlist/6J94NB31fDShla4kzWkSH4", youtube: "", deezer: "https://www.deezer.com/fr/playlist/15925636143" },
    1978: { spotify: "https://open.spotify.com/playlist/3qonUtqrCzZMRdQ2pGoEua", youtube: "", deezer: "https://www.deezer.com/fr/playlist/15925636103" },
    1979: { spotify: "https://open.spotify.com/playlist/4wMcEW8YEjkui283zhG64m", youtube: "", deezer: "https://www.deezer.com/fr/playlist/15925636023" },
    1980: { spotify: "https://open.spotify.com/playlist/5dvPkxzpSe97sgF0exOhvc", youtube: "", deezer: "https://www.deezer.com/fr/playlist/15925636003" },
    1981: { spotify: "https://open.spotify.com/playlist/6WbS7tgGvHsDdCJyNeoHCA", youtube: "", deezer: "https://www.deezer.com/fr/playlist/15925635943" },
    1982: { spotify: "https://open.spotify.com/playlist/4lVrZILpDblIaFmMdrhxFp", youtube: "", deezer: "https://www.deezer.com/fr/playlist/15925635903" },
    1983: { spotify: "https://open.spotify.com/playlist/7vHT0w9j67JR4YtUO4FxCH", youtube: "", deezer: "https://www.deezer.com/fr/playlist/15925635863" },
    1984: { spotify: "https://open.spotify.com/playlist/75yQ0RHpPYFeD5SXYAy45G", youtube: "https://www.youtube.com/playlist?list=PLFQi8DC0rKfM", deezer: "https://www.deezer.com/fr/playlist/15925635823" },
    1985: { spotify: "https://open.spotify.com/playlist/56RjMpzhOrRp8ORMDIIKpR", youtube: "https://www.youtube.com/playlist?list=PLbwaj1cwvy7s", deezer: "https://www.deezer.com/fr/playlist/15925635763" },
    1986: { spotify: "https://open.spotify.com/playlist/6NIPjgqWLtHGCD9T3jnX6a", youtube: "https://www.youtube.com/playlist?list=PLbqc80yQQVsY", deezer: "https://www.deezer.com/fr/playlist/15925635683" },
    1987: { spotify: "https://open.spotify.com/playlist/45xBcsmeuNFYdoK2jjeja1", youtube: "https://www.youtube.com/playlist?list=PLEhIdnQBhi5g", deezer: "https://www.deezer.com/fr/playlist/15925635663" },
    1988: { spotify: "https://open.spotify.com/playlist/77JRF2J6vdYun7OkZhLdtC", youtube: "https://www.youtube.com/playlist?list=PLU8hvd5aY3ls", deezer: "https://www.deezer.com/fr/playlist/15925635603" },
    1989: { spotify: "https://open.spotify.com/playlist/1A4hoHsLSs09WNaB5la2zR", youtube: "https://www.youtube.com/playlist?list=PLd6AY9b6wj5E", deezer: "https://www.deezer.com/fr/playlist/15925635543" },
    1990: { spotify: "https://open.spotify.com/playlist/5ZBgl4L8cZj9tqdX6a7ehF", youtube: "https://www.youtube.com/playlist?list=PLSbEwdjqI_uA", deezer: "https://www.deezer.com/fr/playlist/15925635463" },
    1991: { spotify: "https://open.spotify.com/playlist/1gXAQQSOVKdpB9e8Vi5UFu", youtube: "https://www.youtube.com/playlist?list=PLXXUnBufcyMk", deezer: "https://www.deezer.com/fr/playlist/15925635403" },
    1992: { spotify: "https://open.spotify.com/playlist/3CbBxnMKZqz46RVa1ndMfN", youtube: "https://www.youtube.com/playlist?list=PLB4XmSv5kvhc", deezer: "https://www.deezer.com/fr/playlist/15925635383" },
    1993: { spotify: "https://open.spotify.com/playlist/1VGLZ5JlfYOMu8DTxYCqTp", youtube: "https://www.youtube.com/playlist?list=PLHlOxWEVH23g", deezer: "https://www.deezer.com/fr/playlist/15925635343" },
    1994: { spotify: "https://open.spotify.com/playlist/5C1AOcdpF30oNja8r4SwAK", youtube: "https://www.youtube.com/playlist?list=PLXnet4koLXC0", deezer: "https://www.deezer.com/fr/playlist/15925625223" },
    1995: { spotify: "https://open.spotify.com/playlist/3ESizWJ0XpzftjAfW5pmVK", youtube: "https://www.youtube.com/playlist?list=PLAb6TH8QYG2k", deezer: "https://www.deezer.com/fr/playlist/15925635083" }
  }
};
/* ============================================================ */

const PLATFORM_NAMES = { youtube: "YouTube", spotify: "Spotify", deezer: "Deezer" };
const list = document.getElementById("records");
const arrival = document.getElementById("arrival");
const title = document.getElementById("gen-title");

/* Adresse des QR codes : https://portrait-depoque.github.io/#1977-1984
   (génération-année). Sans ancre, la page affiche la génération 1977. */
const hash = decodeURIComponent(location.hash.replace("#", ""));
const m = hash.match(/^(\d{4})-(\d{4})$/);
let gen = m && GENERATIONS[m[1]] ? m[1] : "1977";
const target = m && m[1] === gen ? Number(m[2]) : null;

/* Plateforme par défaut : la première de la liste (YouTube) qui a la playlist
   de l'année visée (ou toutes les années), sinon la suivante. Le choix du
   lecteur est mémorisé pour ses visites suivantes. */
const ORDER = Object.keys(PLATFORM_NAMES);
const covers = p => target ? Boolean(GENERATIONS[gen][target] && GENERATIONS[gen][target][p])
                           : Object.values(GENERATIONS[gen]).every(y => y[p]);
let platform = ORDER.find(covers) || ORDER.find(p => Object.values(GENERATIONS[gen]).some(y => y[p])) || "spotify";
try { const saved = localStorage.getItem("pe-platform"); if (saved in PLATFORM_NAMES && covers(saved)) platform = saved; } catch (e) {}

function render() {
  title.textContent = "Génération " + gen;
  list.innerHTML = "";
  list.dataset.platform = platform;
  const years = GENERATIONS[gen];
  Object.keys(years).forEach(y => {
    const year = Number(y);
    const age = year - Number(gen);
    const url = years[y][platform];
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "record" + (year === target ? " mine" : "");
    a.id = gen + "-" + year;
    a.innerHTML =
      '<span class="disc" aria-hidden="true"></span>' +
      '<span class="year">' + year + '</span>' +
      '<span class="age">' + (age === 0 ? "Naissance" : age + (age > 1 ? " ans" : " an")) + '</span>';
    if (url) {
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener";
      a.setAttribute("aria-label", "Playlist " + year + " sur " + PLATFORM_NAMES[platform]);
    } else {
      a.setAttribute("aria-disabled", "true");
      a.setAttribute("aria-label", "Playlist " + year + " sur " + PLATFORM_NAMES[platform] + ", bientôt disponible");
    }
    li.appendChild(a);
    list.appendChild(li);
  });
  document.querySelectorAll(".toggle button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.platform === platform)));
}

document.querySelectorAll(".toggle button").forEach(b => {
  b.addEventListener("click", () => {
    platform = b.dataset.platform;
    try { localStorage.setItem("pe-platform", platform); } catch (e) {}
    render();
  });
});

/* Une plateforme sans aucun lien n'est pas affichée. */
document.querySelectorAll(".toggle button").forEach(b => {
  const p = b.dataset.platform;
  const has = Object.values(GENERATIONS[gen]).some(y => y[p]);
  if (!has) { b.hidden = true; if (platform === p) platform = ORDER.find(covers) || "spotify"; }
});

render();

if (target && GENERATIONS[gen][target]) {
  const age = target - Number(gen);
  arrival.textContent = target === Number(gen)
    ? "L'année de ta naissance. Sa playlist est en jaune, juste en dessous."
    : "Tu avais " + age + (age > 1 ? " ans" : " an") + " en " + target + ". Ta playlist est en jaune, juste en dessous.";
  arrival.classList.add("on");
  const el = document.getElementById(gen + "-" + target);
  if (el) {
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(() => el.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" }), 150);
  }
}
</script>
</body>
</html>
